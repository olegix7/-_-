{% extends 'base.html' %}
{% block title %}Видалити резюме{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm mt-4 border-danger">
        <div class="card-body p-4 text-center">
          <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
          <h4 class="fw-bold mt-3">Видалити резюме?</h4>
          <p class="text-muted">Ви впевнені, що хочете видалити резюме <strong>«{{ resume.title }}»</strong>?
            Ця дія незворотна.</p>
          <div class="d-flex gap-3 justify-content-center mt-4">
            <form method="post">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger px-4">
                <i class="bi bi-trash me-1"></i>Так, видалити
              </button>
            </form>
            <a href="{% url 'resume_edit' resume.pk %}" class="btn btn-outline-secondary px-4">Скасувати</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
