{% extends 'base.html' %}
{% block title %}Видалити оголошення{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm mt-4">
        <div class="card-body p-4 text-center">
          <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
          <h4 class="fw-bold mt-3">Видалити оголошення?</h4>
          <p class="text-muted">Буде назавжди видалено: <strong>«{{ announcement.title }}»</strong>.</p>
          <div class="d-flex gap-3 justify-content-center mt-4">
            <form method="post">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger px-4">
                <i class="bi bi-trash me-1"></i>Видалити
              </button>
            </form>
            <a href="{% url 'announcement_list' %}" class="btn btn-outline-secondary px-4">Скасувати</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
